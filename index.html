<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator-container">
        <div class="header">
            <h1>🧮 计算器</h1>
            <div class="header-controls">
                <button id="undoBtn" class="control-btn" onclick="undo()" title="撤销 (Ctrl+Z)">↶</button>
                <button id="redoBtn" class="control-btn" onclick="redo()" title="重做 (Ctrl+Y)">↷</button>
                <button id="soundToggle" class="control-btn" onclick="toggleSound()" title="音效开关">🔊</button>
                <button id="themeToggle" class="theme-toggle" title="切换主题">🌙</button>
                <button id="scientificToggle" class="scientific-toggle" title="科学模式">🔬</button>
            </div>
        </div>
        <div class="main-content">
            <div class="calculator" aria-label="计算器">
                <div class="display-section">
                    <input type="text" id="display" readonly>
                    <div class="history-indicator" id="historyIndicator"></div>
                </div>

                <div class="scientific-panel" id="scientificPanel">
                    <div class="button-row scientific-row">
                        <button class="btn function scientific-btn" onclick="appendParenthesis('(')" title="左括号">(</button>
                        <button class="btn function scientific-btn" onclick="appendParenthesis(')')" title="右括号">)</button>
                        <button class="btn function scientific-btn" onclick="appendOperator('^')" title="幂运算">xʸ</button>
                        <button class="btn function scientific-btn" onclick="appendFunction('x³')" title="立方">x³</button>
                    </div>
                    <div class="button-row scientific-row">
                        <button class="btn function scientific-btn" onclick="appendFunction('|x|')" title="绝对值">|x|</button>
                        <button class="btn function scientific-btn" onclick="appendFunction('n!')" title="阶乘">n!</button>
                        <button class="btn function scientific-btn" onclick="appendFunction('sin')" title="正弦">sin</button>
                        <button class="btn function scientific-btn" onclick="appendFunction('cos')" title="余弦">cos</button>
                    </div>
                    <div class="button-row scientific-row">
                        <button class="btn function scientific-btn" onclick="appendFunction('tan')" title="正切">tan</button>
                        <button class="btn function scientific-btn" onclick="appendFunction('log')" title="常用对数">log</button>
                        <button class="btn function scientific-btn" onclick="appendFunction('ln')" title="自然对数">ln</button>
                        <button class="btn function scientific-btn" onclick="appendFunction('e')" title="欧拉数">e</button>
                    </div>
                    <div class="button-row scientific-row">
                        <button class="btn function scientific-btn" onclick="appendFunction('π')" title="圆周率">π</button>
                    </div>
                </div>

                <div class="buttons">
                    <div class="button-row" data-row="utility">
                        <button class="btn function" onclick="appendFunction('%')">%</button>
                        <button class="btn function" onclick="clearEntry()">CE</button>
                        <button class="btn clear" onclick="clearDisplay()">C</button>
                        <button class="btn delete" onclick="deleteLast()">DEL</button>
                    </div>
                    <div class="button-row" data-row="advanced">
                        <button class="btn function" onclick="appendFunction('1/x')" title="倒数">1/x</button>
                        <button class="btn function" onclick="appendFunction('x²')" title="平方">x²</button>
                        <button class="btn function" onclick="appendFunction('sqrt')" title="平方根">√</button>
                        <button class="btn" onclick="appendOperator('/')" title="除法">÷</button>
                    </div>
                    <div class="button-row" data-row="numbers-7">
                        <button class="btn" onclick="appendNumber('7')">7</button>
                        <button class="btn" onclick="appendNumber('8')">8</button>
                        <button class="btn" onclick="appendNumber('9')">9</button>
                        <button class="btn" onclick="appendOperator('*')" title="乘法">×</button>
                    </div>
                    <div class="button-row" data-row="numbers-4">
                        <button class="btn" onclick="appendNumber('4')">4</button>
                        <button class="btn" onclick="appendNumber('5')">5</button>
                        <button class="btn" onclick="appendNumber('6')">6</button>
                        <button class="btn" onclick="appendOperator('-')" title="减法">−</button>
                    </div>
                    <div class="button-row" data-row="numbers-1">
                        <button class="btn" onclick="appendNumber('1')">1</button>
                        <button class="btn" onclick="appendNumber('2')">2</button>
                        <button class="btn" onclick="appendNumber('3')">3</button>
                        <button class="btn" onclick="appendOperator('+')" title="加法">+</button>
                    </div>
                    <div class="button-row" data-row="numbers-0">
                        <button class="btn function" onclick="toggleSign()">+/-</button>
                        <button class="btn" onclick="appendNumber('0')">0</button>
                        <button class="btn" onclick="appendNumber('.')">.</button>
                        <button class="btn equals" onclick="calculate()" title="计算结果">=</button>
                    </div>
                </div>

                <div class="angle-control">
                    <button id="angleToggle" class="angle-toggle" onclick="toggleAngleMode()" title="切换角度单位">DEG</button>
                </div>
            </div>

            <aside class="history-panel" aria-label="历史记录">
                <div class="history-header">
                    <h3>📋 历史记录</h3>
                    <button class="history-clear" onclick="clearHistory()">清除</button>
                </div>
                <div class="history-list" id="historyList"></div>
            </aside>
        </div>
    <script src="script.js"></script>
</body>
</html>
